name: Synthetic forensic evidence integrity
on:
  push:
    paths:
      - 'tools/**'
      - 'questions/**'
      - 'instructor/ANSWER_KEY_FINAL.md'
      - '.github/workflows/forensic-integrity.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q tools
      - name: Generate evidence
        run: python tools/generate_case.py
      - name: Check educational disclaimer in student archive
        run: |
          unzip -l build/artifacts.zip | grep EDUCATIONAL_USE_NOTICE.txt
          unzip -p build/artifacts.zip EDUCATIONAL_USE_NOTICE.txt | grep 'EDUCATIONAL AND AUTHORIZED'
      - name: Verify evidence
        run: python tools/verify_case.py
      - name: Cross-check backup evidence
        run: python tools/validate_backup_consistency.py
      - name: Validate question mappings
        run: python tools/validate_questions.py
      - name: Reproduce all 20 answers
        run: python tools/verify_answers.py
      - name: Validate native-format synthetic PCAP
        run: python tools/verify_native_pcap.py
      - name: Validate structured forensic exports
        run: python tools/verify_realism_exports.py
      - name: Verify cross-source DFIR reasoning
        run: python tools/verify_cross_source_reasoning.py
      - name: Verify deterministic regeneration
        run: |
          sha256sum build/artifacts.zip > /tmp/first.sha
          python tools/generate_case.py
          sha256sum -c /tmp/first.sha
      - name: Build separated student release
        run: python tools/build_student_release.py
      - name: Verify student release security and integrity
        run: python tools/verify_student_release.py
      - name: Inspect student release archive
        run: |
          unzip -l build/EchoTrace2_STUDENT_RELEASE.zip
          unzip -p build/EchoTrace2_STUDENT_RELEASE.zip SHA256SUMS.txt | grep artifacts.zip
      - name: Install PDF renderer
        run: python -m pip install 'reportlab>=4,<5'
      - name: Generate instructor walkthrough PDF
        run: python tools/build_instructor_pdf.py
      - name: Upload student package
        uses: actions/upload-artifact@v4
        with:
          name: echotrace2-student-release
          path: build/EchoTrace2_STUDENT_RELEASE.zip
      - name: Confirm instructor PDF was generated (do not publish answer key)
        run: test -s build/instructor/WALKTHROUGH_FINAL.pdf
      - name: Record execution summary
        if: always()
        run: |
          echo '## EchoTrace 2 forensic CI' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run checks deterministic synthetic evidence, 20 answers, student release and instructor PDF.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native EVTX, full TLS captures, VM boot and independent blind playtest are separate release gates; synthetic binary PCAP is validated here.' >> "$GITHUB_STEP_SUMMARY"
          if test -f build/EchoTrace2_STUDENT_RELEASE.zip; then sha256sum build/EchoTrace2_STUDENT_RELEASE.zip >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Check draft is not misrepresented as final
        run: |
          test -f questions/DRAFT_QUESTIONS.md
          test -f INSTRUCTOR_NOTES_PRIVATE.md
